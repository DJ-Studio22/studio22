<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Studio 22">
  <!-- Mirrors --color-bg-0 and --color-accent from styles/tokens.css. An SVG
       cannot read a CSS custom property from another document, so these two
       values are duplicated here on purpose; they are the only copies. -->
  <rect width="64" height="64" rx="12" fill="#0a0908"/>
  <text x="32" y="45"
        font-family="Segoe UI, SF Pro Display, system-ui, sans-serif"
        font-size="34" font-weight="800" letter-spacing="-2"
        text-anchor="middle" fill="#ffa22b">22</text>
</svg>
