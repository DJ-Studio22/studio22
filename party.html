<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Party — Studio 22</title>
  <meta name="description" content="Hot-seat tournaments for two to eight players. One screen, one controller, nothing saved." />

  <!-- BEGIN generated metadata — tools/inject-meta.mjs -->
  <link rel="canonical" href="https://studio22-anw.pages.dev/party.html" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Studio 22" />
  <meta property="og:title" content="Party — Studio 22" />
  <meta property="og:description" content="Hot-seat tournaments for two to eight players. One screen, one controller, nothing saved." />
  <meta property="og:url" content="https://studio22-anw.pages.dev/party.html" />

  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Party — Studio 22" />
  <meta name="twitter:description" content="Hot-seat tournaments for two to eight players. One screen, one controller, nothing saved." />

  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="/site.webmanifest" />
  <!-- END generated metadata -->
  <!-- Mirrors --color-bg-0. A meta tag cannot read a custom property. -->
  <meta name="theme-color" content="#0a0908" />

  <link rel="stylesheet" href="/styles/tokens.css" />
  <link rel="stylesheet" href="/styles/tournament.css" />
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--color-bg-0);
      color: var(--color-text-primary);
      font-family: var(--font-body);
      /* The cursor is driven by a gamepad as often as by a finger, and a
         stray drag scrolling the page underneath it is disorienting on a
         screen that already fits. */
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
    }

    /* Shown only if the module never runs. Everything below it is built by
       script, so with no JavaScript this page would otherwise be blank. */
    .tn-noscript {
      max-width: 40rem;
      margin: 4rem auto;
      padding: 0 1rem;
      text-align: center;
      line-height: 1.6;
    }
    .tn-noscript a { color: var(--color-accent); }
  </style>
</head>
<body>
  <main id="tournament" class="tn-root">
    <noscript>
      <div class="tn-noscript">
        <h1>Party mode needs JavaScript</h1>
        <p>
          Tournaments run entirely in this tab — there is no server to fall
          back to. <a href="/arcade.html">Back to the arcade</a>.
        </p>
      </div>
    </noscript>
  </main>

  <script type="module">
    import { TournamentUI } from '/engine/tournament-ui.js';

    // The whole page is one mounted component. It picks up a tournament
    // already in progress on its own, which is how a turn returning from a
    // game lands on the standings rather than back at setup.
    TournamentUI.mount(document.getElementById('tournament'));
  </script>
</body>
</html>
