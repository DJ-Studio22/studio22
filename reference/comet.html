<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>COMET</title>
<style>
  html,body{margin:0;height:100%;background:#05060f;overflow:hidden;
    font-family:"Trebuchet MS",Verdana,sans-serif;color:#e8ecff;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{background:#05060f;display:block;touch-action:none;}
  #ui{position:fixed;inset:0;pointer-events:none;}
  .hud{position:absolute;top:18px;left:0;right:0;display:flex;justify-content:center;gap:38px;
    font-size:15px;letter-spacing:2px;text-shadow:0 0 12px rgba(0,0,0,.9);}
  .hud b{display:block;font-size:26px;letter-spacing:1px;font-weight:700;margin-top:3px;}
  .lab{opacity:.55;font-size:11px;letter-spacing:3px;}
  .sc b{color:#ffd84d;} .wv b{color:#4dd8ff;} .lv b{color:#ff6b8a;}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;background:rgba(5,6,15,.86);padding:20px;}
  .screen.hide{display:none;}
  h1{font-size:74px;margin:0;letter-spacing:16px;color:#fff;
    text-shadow:0 0 30px #4dd8ff,0 0 70px #2a6cff;}
  .tag{margin:6px 0 30px;opacity:.6;letter-spacing:5px;font-size:12px;}
  .keys{display:grid;grid-template-columns:auto auto;gap:9px 20px;font-size:14px;
    margin-bottom:32px;opacity:.85;}
  .keys i{font-style:normal;color:#4dd8ff;text-align:right;}
  .go{font-size:17px;letter-spacing:3px;color:#ffd84d;animation:pulse 1.3s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .pad{margin-top:24px;font-size:12px;letter-spacing:2px;}
  .on{color:#5aff9d;} .off{color:#ff6b8a;}
  h2{font-size:52px;margin:0 0 4px;letter-spacing:10px;color:#ff6b8a;
    text-shadow:0 0 30px #ff2d55;}
  .fin{font-size:20px;letter-spacing:3px;margin-bottom:26px;}
  .fin em{font-style:normal;color:#ffd84d;font-size:34px;font-weight:700;}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>

<div id="ui">
  <div class="hud">
    <div class="sc"><span class="lab">SCORE</span><b id="score">0</b></div>
    <div class="wv"><span class="lab">WAVE</span><b id="wave">1</b></div>
    <div class="lv"><span class="lab">LIVES</span><b id="lives">3</b></div>
  </div>

  <div class="screen" id="title">
    <h1>COMET</h1>
    <div class="tag">YOUR TAIL IS YOUR WEAPON</div>
    <div class="keys">
      <i>LEFT STICK</i><span>fly</span>
      <i>A / RT</i><span>burn (dash through anything)</span>
      <i>ARROWS / WASD</i><span>fly, if no controller</span>
      <i>SPACE</i><span>burn, if no controller</span>
    </div>
    <div class="go" id="startline">PRESS A OR SPACE TO LAUNCH</div>
    <div class="pad" id="padstate">controller: <span class="off">not detected</span></div>
  </div>

  <div class="screen hide" id="over">
    <h2>BURNED OUT</h2>
    <div class="tag">the void always wins</div>
    <div class="fin">FINAL SCORE <em id="final">0</em></div>
    <div class="go">PRESS A OR SPACE TO FLY AGAIN</div>
  </div>
</div>

<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let W=0,H=0;
function fit(){
  const s=Math.min(window.innerWidth/960,window.innerHeight/600);
  W=960;H=600;c.width=W;c.height=H;
  c.style.width=(W*s)+'px';c.style.height=(H*s)+'px';
}
addEventListener('resize',fit);fit();

const R=(a,b)=>a+Math.random()*(b-a);
const TAU=Math.PI*2;

let state='title',score=0,wave=1,lives=3,waveTimer=0,shake=0;
let stars=[],tail=[],foes=[],dust=[],bits=[];
let tailMax=42, burn=0, burnCool=0, inv=0;

const P={x:W/2,y:H/2,vx:0,vy:0,r:9};

for(let i=0;i<130;i++)stars.push({x:R(0,W),y:R(0,H),z:R(.2,1)});

/* ---------- input ---------- */
const keys={};
addEventListener('keydown',e=>{
  keys[e.code]=1;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(e.code==='Space')press();
});
addEventListener('keyup',e=>keys[e.code]=0);

let padPrev=false;
function readPad(){
  const g=(navigator.getGamepads?navigator.getGamepads():[])[0];
  const o={mx:0,my:0,burn:false,pad:false};
  if(g){
    o.pad=true;
    const dz=v=>Math.abs(v)>0.16?v:0;
    o.mx=dz(g.axes[0]||0); o.my=dz(g.axes[1]||0);
    const b=g.buttons;
    o.burn = (b[0]&&b[0].pressed)||(b[7]&&b[7].value>.4)||(b[5]&&b[5].pressed);
    if(b[12]&&b[12].pressed)o.my=-1;
    if(b[13]&&b[13].pressed)o.my=1;
    if(b[14]&&b[14].pressed)o.mx=-1;
    if(b[15]&&b[15].pressed)o.mx=1;
    const st=(b[0]&&b[0].pressed)||(b[9]&&b[9].pressed);
    if(st&&!padPrev)press();
    padPrev=st;
  }else padPrev=false;
  if(keys['ArrowLeft']||keys['KeyA'])o.mx=-1;
  if(keys['ArrowRight']||keys['KeyD'])o.mx=1;
  if(keys['ArrowUp']||keys['KeyW'])o.my=-1;
  if(keys['ArrowDown']||keys['KeyS'])o.my=1;
  if(keys['Space'])o.burn=true;
  return o;
}
function press(){ if(state!=='play')start(); }

/* ---------- flow ---------- */
function start(){
  state='play';score=0;wave=1;lives=3;tailMax=42;
  P.x=W/2;P.y=H/2;P.vx=P.vy=0;
  tail=[];foes=[];dust=[];bits=[];
  burn=0;burnCool=0;inv=90;waveTimer=0;
  spawnWave();
  document.getElementById('title').classList.add('hide');
  document.getElementById('over').classList.add('hide');
}
function dead(){
  state='over';
  document.getElementById('final').textContent=score;
  document.getElementById('over').classList.remove('hide');
}

function spawnWave(){
  const n=3+wave*2;
  for(let i=0;i<n;i++)foes.push(makeFoe());
  for(let i=0;i<5;i++)dust.push(makeDust());
}
function makeFoe(){
  const s=Math.floor(R(0,4));
  let px,py;
  if(s===0){px=R(0,W);py=-30}else if(s===1){px=W+30;py=R(0,H)}
  else if(s===2){px=R(0,W);py=H+30}else{px=-30;py=R(0,H)}
  const hunter=Math.random()<Math.min(.15+wave*.05,.55);
  return{x:px,y:py,vx:0,vy:0,r:hunter?11:14,
    sp:hunter?(1.5+wave*.08):(0.75+wave*.05),
    hunter,spin:R(0,TAU),ang:R(0,TAU)};
}
function makeDust(){return{x:R(60,W-60),y:R(60,H-60),r:7,p:R(0,TAU)};}

/* ---------- particles ---------- */
function boom(px,py,col,n){
  for(let i=0;i<n;i++){
    const a=R(0,TAU),s=R(1,5.5);
    bits.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:R(20,42),m:42,c:col});
  }
}

/* ---------- loop ---------- */
function step(){
  const I=readPad();
  document.getElementById('padstate').innerHTML =
    'controller: '+(I.pad?'<span class="on">connected</span>':'<span class="off">not detected</span>');

  if(state==='play'){
    // move
    const acc=I.burn&&burn>0?1.15:0.62;
    P.vx+=I.mx*acc; P.vy+=I.my*acc;
    P.vx*=0.925; P.vy*=0.925;
    const cap=I.burn&&burn>0?11:6.4;
    const sp=Math.hypot(P.vx,P.vy);
    if(sp>cap){P.vx=P.vx/sp*cap;P.vy=P.vy/sp*cap;}
    P.x+=P.vx;P.y+=P.vy;
    if(P.x<P.r){P.x=P.r;P.vx*=-.5}if(P.x>W-P.r){P.x=W-P.r;P.vx*=-.5}
    if(P.y<P.r){P.y=P.r;P.vy*=-.5}if(P.y>H-P.r){P.y=H-P.r;P.vy*=-.5}

    // burn meter
    if(I.burn&&burnCool<=0&&burn<=0&&sp>0.5){burn=34;}
    if(burn>0){burn--;if(burn===0)burnCool=48;}
    if(burnCool>0)burnCool--;
    if(inv>0)inv--;

    // tail
    tail.unshift({x:P.x,y:P.y});
    while(tail.length>tailMax)tail.pop();

    // dust
    for(let i=dust.length-1;i>=0;i--){
      const d=dust[i];d.p+=0.07;
      if(Math.hypot(d.x-P.x,d.y-P.y)<d.r+P.r+4){
        dust.splice(i,1);score+=25;tailMax+=6;
        boom(d.x,d.y,'255,216,77',14);
        dust.push(makeDust());
      }
    }

    // foes
    for(let i=foes.length-1;i>=0;i--){
      const f=foes[i];
      if(f.hunter){
        const a=Math.atan2(P.y-f.y,P.x-f.x);
        f.vx+=Math.cos(a)*0.09;f.vy+=Math.sin(a)*0.09;
        f.vx*=0.97;f.vy*=0.97;
        const s2=Math.hypot(f.vx,f.vy);
        if(s2>f.sp){f.vx=f.vx/s2*f.sp;f.vy=f.vy/s2*f.sp;}
      }else{
        if(!f.set){const a=Math.atan2(H/2-f.y+R(-140,140),W/2-f.x+R(-140,140));
          f.vx=Math.cos(a)*f.sp;f.vy=Math.sin(a)*f.sp;f.set=1;}
        if(f.x<-40)f.x=W+40; if(f.x>W+40)f.x=-40;
        if(f.y<-40)f.y=H+40; if(f.y>H+40)f.y=-40;
      }
      f.x+=f.vx;f.y+=f.vy;f.spin+=0.05;

      // head hit
      if(Math.hypot(f.x-P.x,f.y-P.y)<f.r+P.r){
        if(burn>0||inv>0){
          foes.splice(i,1);score+=f.hunter?90:60;
          boom(f.x,f.y,f.hunter?'255,107,138':'255,160,60',26);shake=9;
          continue;
        }
        lives--;inv=120;shake=22;
        boom(P.x,P.y,'255,107,138',40);
        tailMax=Math.max(28,tailMax-14);
        foes.splice(i,1);
        P.vx=P.vy=0;
        if(lives<=0){dead();break;}
        continue;
      }
      // tail hit
      let burned=false;
      for(let t=6;t<tail.length;t+=2){
        const seg=tail[t];
        const w=3+9*(1-t/tail.length);
        if(Math.hypot(f.x-seg.x,f.y-seg.y)<f.r+w){burned=true;break;}
      }
      if(burned){
        foes.splice(i,1);
        score+=f.hunter?120:70;
        boom(f.x,f.y,'77,216,255',24);shake=6;
      }
    }

    // next wave
    if(foes.length===0){
      wave++;waveTimer=0;spawnWave();
      score+=wave*40;
    }

    // particles
    for(let i=bits.length-1;i>=0;i--){
      const b=bits[i];b.x+=b.vx;b.y+=b.vy;b.vx*=.95;b.vy*=.95;b.l--;
      if(b.l<=0)bits.splice(i,1);
    }
    if(shake>0)shake*=.86;

    document.getElementById('score').textContent=score;
    document.getElementById('wave').textContent=wave;
    document.getElementById('lives').textContent=Math.max(0,lives);
  }

  draw();
  requestAnimationFrame(step);
}

/* ---------- draw ---------- */
function draw(){
  x.save();
  if(shake>.4)x.translate(R(-shake,shake),R(-shake,shake));

  x.fillStyle='#05060f';x.fillRect(-40,-40,W+80,H+80);

  // starfield
  for(const s of stars){
    x.globalAlpha=s.z*.7;
    x.fillStyle='#9fb4ff';
    x.fillRect(s.x,s.y,s.z*2,s.z*2);
  }
  x.globalAlpha=1;

  if(state==='play'||state==='over'){
    // dust
    for(const d of dust){
      const pu=1+Math.sin(d.p)*.25;
      x.shadowBlur=22;x.shadowColor='#ffd84d';
      x.fillStyle='#ffd84d';
      x.beginPath();x.arc(d.x,d.y,d.r*pu,0,TAU);x.fill();
      x.shadowBlur=0;
    }

    // tail
    for(let i=tail.length-1;i>0;i--){
      const t=tail[i],f=1-i/tail.length;
      const w=3+9*f;
      x.globalAlpha=.16+f*.8;
      x.shadowBlur=18;
      x.shadowColor=burn>0?'#ffd84d':'#4dd8ff';
      x.fillStyle=burn>0?`rgb(255,${180+f*60|0},77)`:`rgb(${60+f*40|0},${170+f*70|0},255)`;
      x.beginPath();x.arc(t.x,t.y,w,0,TAU);x.fill();
    }
    x.globalAlpha=1;x.shadowBlur=0;

    // foes
    for(const f of foes){
      x.save();x.translate(f.x,f.y);x.rotate(f.spin);
      x.shadowBlur=16;
      if(f.hunter){
        x.shadowColor='#ff2d55';x.fillStyle='#ff6b8a';
        x.beginPath();
        for(let i=0;i<3;i++){const a=i/3*TAU;
          x[i?'lineTo':'moveTo'](Math.cos(a)*f.r,Math.sin(a)*f.r);}
        x.closePath();x.fill();
      }else{
        x.shadowColor='#ff9500';x.fillStyle='#ffa63d';
        x.beginPath();
        for(let i=0;i<6;i++){const a=i/6*TAU;
          x[i?'lineTo':'moveTo'](Math.cos(a)*f.r,Math.sin(a)*f.r);}
        x.closePath();x.fill();
        x.fillStyle='#05060f';
        x.beginPath();x.arc(0,0,f.r*.38,0,TAU);x.fill();
      }
      x.restore();
    }
    x.shadowBlur=0;

    // player
    if(state==='play'&&(inv<=0||Math.floor(inv/5)%2===0)){
      x.save();x.translate(P.x,P.y);
      x.rotate(Math.atan2(P.vy,P.vx));
      x.shadowBlur=26;x.shadowColor=burn>0?'#ffd84d':'#ffffff';
      x.fillStyle=burn>0?'#ffd84d':'#ffffff';
      x.beginPath();
      x.moveTo(P.r*1.6,0);x.lineTo(-P.r,P.r*.85);
      x.lineTo(-P.r*.4,0);x.lineTo(-P.r,-P.r*.85);
      x.closePath();x.fill();
      x.restore();x.shadowBlur=0;
    }

    // particles
    for(const b of bits){
      x.globalAlpha=b.l/b.m;
      x.fillStyle=`rgba(${b.c},1)`;
      x.fillRect(b.x-2,b.y-2,4,4);
    }
    x.globalAlpha=1;

    // burn meter
    const bw=170,bh=6,bx=W/2-bw/2,by=H-30;
    x.fillStyle='rgba(255,255,255,.12)';x.fillRect(bx,by,bw,bh);
    let pct = burn>0 ? burn/34 : (burnCool>0 ? 1-burnCool/48 : 1);
    x.fillStyle = burn>0?'#ffd84d':(burnCool>0?'#5a6a99':'#4dd8ff');
    x.fillRect(bx,by,bw*pct,bh);
    x.font='10px Verdana';x.fillStyle='rgba(255,255,255,.45)';
    x.textAlign='center';x.fillText('BURN',W/2,by-8);
  }
  x.restore();
}

step();
</script>
</body>
</html>
