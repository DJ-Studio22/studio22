  <meta property="og:description" content="Three lanes, one shield, and a tempo that will not stop climbing. Attacks fall down the lanes; slide the shield across and block them on the beat, where being on the beat is worth triple. There is no soundtrack to follow because there is no soundtrack: the engine synthesises tones, so the chart is the source of truth and the drums and notes are played from the same list of numbers the game judges you against, which is why the two can never drift apart. The judging windows are in milliseconds rather than fractions of a beat, so a faster phrase asks for more and never for more precision — and the shield takes real time to change lane, so a chart is only dealt if the shield could physically get there. Two hundred phrases were walked looking for one that could not be played. Attacks blocked, weighted by timing, is the score." />

<body>
  <!-- Shown until the game boots, and NOT removed by script that could itself
       be the thing that failed: engine/canvas.js deletes it when it builds the
       canvas. If the module never parses — which is exactly what took every
       game to a black screen once — this stays on screen and says so. -->
  <div id="boot-fallback">
    <h1>Loading&hellip;</h1>
    <p>If this message stays, the game failed to start. Reloading usually fixes it.</p>
