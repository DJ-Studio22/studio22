  <meta property="og:description" content="Fly as far down an endless corridor as you can, using bodies whose pull near them is stronger than your engine. The world is generated ahead of you and forgotten behind, the camera follows with the craft a third of the way across so most of the screen is corridor you have not flown yet, and green rings scattered along the way fill the tank when you pass through one. The dotted line ahead of the craft is drawn by calling the same function the craft flies with, over a copy of the same state, and it stops where the flight would stop -- so a line that runs into a planet ends at the planet rather than promising a clear route through. Measured, a pilot with three seconds of that line flies eleven times further than one with none; past six seconds it stops paying, because the line answers where this takes you if you keep doing it and is worth exactly as much as the time you keep doing it. Distance is the score." />

<body>
  <!-- Shown until the game boots, and NOT removed by script that could itself
       be the thing that failed: engine/canvas.js deletes it when it builds the
       canvas. If the module never parses — which is exactly what took every
       game to a black screen once — this stays on screen and says so. -->
  <div id="boot-fallback">
    <h1>Loading&hellip;</h1>
    <p>If this message stays, the game failed to start. Reloading usually fixes it.</p>
    <p><a href="/arcade.html">Back to the arcade</a></p>
  </div>
