<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Number Crunch — Studio 22</title>
  <meta name="description" content="Math problems fall from the sky. Fly under the right answer and shoot it." />
  <!-- Mirrors --color-bg-0. A meta tag cannot read a custom property. -->
  <meta name="theme-color" content="#0a0908" />

  <!-- tokens.css is required, not decorative: engine/ui.js resolves the
       palette from the document to draw the shell's pause and game over
       screens. Without it those fall back to a plain degraded palette. -->
  <link rel="stylesheet" href="/styles/tokens.css" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: var(--color-bg-0);
      overflow: hidden;
      /* The game owns every touch on the page. */
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <!-- GameCanvas builds its own letterboxed container inside <body>. -->
  <script type="module" src="./game.js"></script>
</body>
</html>
